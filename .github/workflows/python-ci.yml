name: Python CI with Coverage & Static Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        pip install pytest coverage flake8

    - name: Run static analysis (flake8)
      run: flake8 .

    - name: Run tests with coverage
      run: |
        coverage run --branch -m pytest CalcTest.py
        coverage report -m
        coverage xml
